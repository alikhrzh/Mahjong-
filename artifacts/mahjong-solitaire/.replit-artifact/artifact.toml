kind = "web"
previewPath = "/"
title = "Mahjong Solitaire"
version = "1.0.0"
id = "artifacts/mahjong-solitaire"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22887

[services.development]
run = "pnpm --filter @workspace/mahjong-solitaire run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mahjong-solitaire", "run", "build" ]
publicDir = "artifacts/mahjong-solitaire/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22887"
BASE_PATH = "/"
